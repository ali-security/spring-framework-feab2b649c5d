name: "Seal build (spring-context jar + framework test suite)"

# Authored for the sealed build: upstream 5.2.x has no GitHub Actions workflow that
# builds or tests (its CI is Concourse running `./gradlew build` on JDK 8). This file
# builds the spring-context jar and runs the framework's test suites, one module group per
# leg, on the project's own Gradle wrapper (5.6.4) and JDK 8.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Gradle test selector, e.g. ':spring-context:test --tests org.springframework.validation.DataBinderTests'. Empty runs the full suite."
        required: false
        default: ""

env:
  GRADLE_ARGS: >-
    --no-daemon --console=plain --stacktrace --no-scan --no-build-cache --max-workers=4
    -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  build-and-test:
    name: "${{ matrix.leg }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.test-filter == '' && '["core","beans-aop","context","data","messaging","web","webflux","webmvc","test"]' || '["context"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Strip CI-only Gradle Enterprise / Artifactory wiring (needs spring.io credentials)
        shell: bash
        run: |
          # ge.spring.io build scans + conventions plugin (only on the private plugins-release repo)
          sed -i "/io\.spring\.gradle-enterprise-conventions/d; /id 'com\.gradle\.build-scan'/d; /build-scan-user-data\.gradle/d" build.gradle
          # Artifactory publish plugin: publish-only, its build-info deps were JCenter-only
          sed -i '/id "com\.jfrog\.artifactory"/d' build.gradle
          sed -i "/apply plugin: 'com\.jfrog\.artifactory'/d" gradle/publications.gradle
          awk 'BEGIN{d=0} /^artifactoryPublish[[:space:]]*\{/{skip=1} skip{n=gsub(/\{/,"{"); m=gsub(/\}/,"}"); d+=n-m; if(d<=0){skip=0}; next} {print}' gradle/publications.gradle > /tmp/pub.gradle && mv /tmp/pub.gradle gradle/publications.gradle
          # Remote ge.spring.io build cache (HTTP 400 without credentials) and private plugins-release repo (401)
          sed -i '/build-cache-settings\.gradle/d; /repo\.spring\.io\/plugins-release/d' settings.gradle buildSrc/settings.gradle
          if grep -nE 'gradle-enterprise-conventions|com\.gradle\.build-scan|build-scan-user-data|com\.jfrog\.artifactory' build.gradle \
             || grep -nE 'artifactory' gradle/publications.gradle \
             || grep -nE 'build-cache-settings|plugins-release' settings.gradle buildSrc/settings.gradle; then
            echo "ERROR: CI-only wiring still present after strip" >&2
            exit 1
          fi

      - name: Gradle init script (test counts, skipped-test names, test JVM settings)
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d ~/seal-jaxp-services/META-INF/services
          echo 'com.sun.org.apache.xerces.internal.jaxp.DocumentBuilderFactoryImpl' > ~/seal-jaxp-services/META-INF/services/javax.xml.parsers.DocumentBuilderFactory
          cat > ~/.gradle/init.d/seal-test-results.gradle <<'INIT'
          allprojects {
              tasks.withType(Test) {
                  outputs.upToDateWhen { false }
                  // spring.io's CDN answers 403 to the bare "Java/1.8" User-Agent, which would make
                  // ResourceTests.nonFileResourceExists assume-skip; Java appends "Java/x" to http.agent.
                  systemProperty 'http.agent', 'Mozilla/5.0'
                  // JDK 8: BlockHound's shaded ByteBuddy self-attach loads libattach in its own classloader,
                  // after which mockk's attach fails with UnsatisfiedLinkError. Preloading byte-buddy-agent
                  // as -javaagent lets mockk reuse the Instrumentation instead of attaching.
                  def testTask = it
                  doFirst {
                      def agentJar = testTask.classpath.find { f -> f.name ==~ /byte-buddy-agent-[0-9.]+\.jar/ }
                      if (agentJar != null) {
                          testTask.jvmArgs("-javaagent:${agentJar}")
                      }
                      // ServiceLoaderTests assume a META-INF/services provider for DocumentBuilderFactory,
                      // which the JDK does not ship; register the JDK's own built-in impl so they run.
                      if (project.path == ':spring-beans') {
                          testTask.classpath = testTask.classpath + project.files(System.getProperty('user.home') + '/seal-jaxp-services')
                      }
                  }
                  testLogging {
                      events "failed"
                      exceptionFormat "full"
                  }
                  afterTest { desc, result ->
                      if (result.resultType == TestResult.ResultType.SKIPPED) {
                          println("TEST SKIPPED [${project.path}]: ${desc.className} > ${desc.name}")
                      }
                  }
                  afterSuite { desc, result ->
                      if (desc.parent == null) {
                          println("TEST SUMMARY [${testTask.path}]: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped")
                      }
                  }
              }
          }
          INIT

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p seal-logs
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew $GRADLE_ARGS :spring-context:jar ${{ inputs.test-filter }} 2>&1 | tee seal-logs/gradle.log
            exit 0
          fi
          case "${{ matrix.leg }}" in
            core)      TASKS=":spring-core:test" ;;
            beans-aop) TASKS=":spring-beans:test :spring-aop:test :spring-aspects:test :spring-expression:test" ;;
            context)   TASKS=":spring-context:jar :spring-context:test :spring-context-indexer:test :spring-context-support:test" ;;
            data)      TASKS=":spring-tx:test :spring-jdbc:test :spring-orm:test :spring-oxm:test :spring-jms:test" ;;
            messaging) TASKS=":spring-messaging:test :spring-websocket:test" ;;
            web)       TASKS=":spring-web:test" ;;
            webflux)   TASKS=":spring-webflux:test" ;;
            webmvc)    TASKS=":spring-webmvc:test" ;;
            test)      TASKS=":spring-test:test :integration-tests:test" ;;
            *) echo "unknown leg ${{ matrix.leg }}" >&2; exit 1 ;;
          esac
          ./gradlew $GRADLE_ARGS --continue $TASKS 2>&1 | tee seal-logs/gradle.log

      - name: Upload spring-context jar
        if: matrix.leg == 'context'
        uses: actions/upload-artifact@v4
        with:
          name: spring-context-jar
          path: |
            spring-context/build/libs/spring-context-*.jar
            !spring-context/build/libs/*-test-fixtures.jar
            !spring-context/build/libs/*-sources.jar
            !spring-context/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Test results (skipped-test reasons and totals)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cat > /tmp/seal_skip_report.py <<'PY'
          import glob, os, re, sys

          log = open("seal-logs/gradle.log", encoding="utf-8", errors="replace").read() if os.path.exists("seal-logs/gradle.log") else ""
          skips = sorted(set(re.findall(r"^TEST SKIPPED \[[^\]]*\]: (.+?) > (.+)$", log, re.M)))
          index = {}
          for p in glob.glob("**/src/test/java/**/*.java", recursive=True) + glob.glob("**/src/test/kotlin/**/*.kt", recursive=True):
              m = re.search(r"/src/test/(?:java|kotlin)/(.+)\.(?:java|kt)$", p)
              if m:
                  index.setdefault(m.group(1).replace("/", "."), p)
          ANN = re.compile(r"@(Disabled\w*|Ignore|Enabled\w*|IfProfileValue)\b.*")
          ASSUME = re.compile(r"\b(assume\w*|Assumptions\.\w+|Assume\.\w+)\s*\(")

          def read(path):
              return open(path, encoding="utf-8", errors="replace").read().splitlines()

          def method_name(raw):
              n = raw.strip()
              n = re.sub(r"\[[^\]]*\]$", "", n).strip()
              n = re.sub(r"\(.*\)$", "", n).strip()
              return n.strip("`").strip()

          def parent_of(lines, path):
              text = "\n".join(lines)
              m = re.search(r"\bclass\s+\w+(?:<[^{]*?>)?\s+extends\s+([A-Z]\w*)", text) or re.search(r"\bclass\s+\w+.*?:\s*([A-Z]\w*)\(", text)
              if not m:
                  return None
              parent = m.group(1)
              imp = re.search(r"^import\s+([\w.]+\." + parent + r")\s*;?$", text, re.M)
              if imp and imp.group(1) in index:
                  return index[imp.group(1)]
              for ext in (".java", ".kt"):
                  cand = os.path.join(os.path.dirname(path), parent + ext)
                  if os.path.exists(cand):
                      return cand
              return None

          def find_method(path, name):
              pat = re.compile(r"(void|fun)\s+`?" + re.escape(name) + r"`?\s*\(")
              hops = 0
              while path and hops < 5:
                  lines = read(path)
                  for i, l in enumerate(lines):
                      if pat.search(l):
                          return path, lines, i
                  path = parent_of(lines, path)
                  hops += 1
              return None, None, None

          def body_assumes(lines, start):
              out, depth, seen = [], 0, False
              for l in lines[start:start + 80]:
                  if ASSUME.search(l):
                      out.append(l.strip())
                  depth += l.count("{") - l.count("}")
                  if "{" in l:
                      seen = True
                  if seen and depth <= 0:
                      break
              return out

          def class_reasons(lines, simple_names):
              out = []
              for s in simple_names:
                  for i, l in enumerate(lines):
                      if re.search(r"\b(class|interface)\s+" + re.escape(s) + r"\b", l):
                          for a in lines[max(0, i - 8):i + 1]:
                              if ANN.search(a) and not a.strip().startswith("import"):
                                  out.append(a.strip())
                          break
              return out

          def setup_assumes(lines):
              out = []
              for i, l in enumerate(lines):
                  if re.search(r"@(BeforeEach|BeforeAll|Before|BeforeClass)\b", l):
                      out += body_assumes(lines, i + 1)
              return out

          print("===== SKIPPED TEST REASONS (%d) =====" % len(skips))
          for cls, raw in skips:
              outer = cls.split("$")[0]
              simple = [cls.split(".")[-1].split("$")[-1], outer.split(".")[-1]]
              src = index.get(outer)
              reason = ""
              if src:
                  name = method_name(raw)
                  mpath, lines, i = find_method(src, name) if name else (None, None, None)
                  if lines is not None:
                      anns = [l.strip() for l in lines[max(0, i - 8):i + 1] if ANN.search(l)]
                      if anns:
                          reason = "; ".join(anns)
                      else:
                          a = body_assumes(lines, i)
                          if a:
                              reason = "assumption in test body not met: " + " ".join(a)
                      if mpath != src and reason:
                          reason = "inherited from %s: %s" % (os.path.basename(mpath), reason)
                  slines = read(src)
                  if not reason:
                      c = class_reasons(slines, simple)
                      if c:
                          reason = "class-level: " + "; ".join(c)
                  if not reason:
                      # class-level annotation inherited from a superclass (e.g. abstract integration-test base)
                      ppath, plines, hops = parent_of(slines, src), None, 0
                      while ppath and hops < 5 and not reason:
                          plines = read(ppath)
                          c = class_reasons(plines, [os.path.splitext(os.path.basename(ppath))[0]])
                          if c:
                              reason = "class-level, inherited from %s: %s" % (os.path.basename(ppath), "; ".join(c))
                          ppath, hops = parent_of(plines, ppath), hops + 1
                  if not reason:
                      s = setup_assumes(slines)
                      if not s and mpath and mpath != src:
                          s = setup_assumes(read(mpath))
                      if s:
                          reason = "assumption in setup not met: " + " ".join(s)
                  if not reason:
                      a = [l.strip() for l in slines if ASSUME.search(l)]
                      if a:
                          reason = "assumption in class not met: " + " ".join(a[:3])
              print("SKIPPED TEST %s > %s -- reason: %s" % (cls, raw, reason or "<no annotation/assumption found in %s>" % (src or "source not found")))
          print("===== END SKIPPED TEST REASONS =====")
          for line in re.findall(r"^TEST SUMMARY .*$", log, re.M):
              print(line)
          PY
          python3 /tmp/seal_skip_report.py
